name: Update README with Daily Stats

on:
  schedule:
    # Runs daily at 03:17 AM UTC to avoid GitHub's heavy cron queue
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update daily stats
        run: |
          cat > update-stats.js << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const readmePath = path.join(process.cwd(), 'README.md');

          // Replaces everything between <!-- NAME:START --> and <!-- NAME:END -->
          // Tolerates extra spaces inside the markers (e.g. "END  -->")
          function replaceBlock(content, name, lines) {
            const re = new RegExp('<!--\\s*' + name + ':START\\s*-->[\\s\\S]*?<!--\\s*' + name + ':END\\s*-->');
            if (!re.test(content)) {
              console.warn('WARNING: markers for ' + name + ' not found in README.md');
              return content;
            }
            const block = ['<!-- ' + name + ':START -->'].concat(lines, ['<!-- ' + name + ':END -->']).join('\n');
            return content.replace(re, function () { return block; });
          }

          const now = new Date();
          const currentDate = now.toLocaleDateString('en-US', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            timeZone: 'UTC'
          });
          const currentTime = now.toISOString();

          let content = fs.readFileSync(readmePath, 'utf8');

          content = replaceBlock(content, 'DAILY_STATS', [
            "**🗓️ Today's Date:** " + currentDate,
            '',
            '**⏰ Last Updated:** ' + currentTime,
            '',
            '**📈 Profile Views:** ![Profile Views](https://komarev.com/ghpvc/?username=haiderimam07&color=brightgreen)'
          ]);

          const activities = [
            '🔄 Updated profile README with latest stats',
            '📊 Refreshed daily metrics',
            '⚡ Automated workflow execution',
            '🚀 Maintained active development streak',
            '🔧 Optimized repository automation'
          ];
          const randomActivity = activities[Math.floor(Math.random() * activities.length)];

          content = replaceBlock(content, 'RECENT_ACTIVITY', [
            '**⚡ Recent GitHub Activity:**',
            '- ' + randomActivity,
            '- 📅 Daily README update: ' + currentDate,
            '- 🤖 Automated via GitHub Actions'
          ]);

          fs.writeFileSync(readmePath, content);
          console.log('README updated successfully!');
          EOF

          node update-stats.js

      - name: Commit and push changes
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Daily README update - $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
